name: Release client skill
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching skill metadata
        required: true
        default: '0.2.0'
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/validate_skills.py
      - run: python -m unittest discover -s tests
      - run: python scripts/build_bundle.py
      - run: gh release create "v${RELEASE_VERSION}" dist/* --target "${GITHUB_SHA}" --title "xAgent ID Skill ${RELEASE_VERSION}" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
